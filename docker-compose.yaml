# Local Postgres for development and tests. `pnpm db:up` starts them.
name: brain

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: brain
      POSTGRES_PASSWORD: brain
      POSTGRES_DB: brain
    ports:
      - "${POSTGRES_PORT:-4693}:5432"
    volumes:
      - postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U brain -d brain"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  postgres:
