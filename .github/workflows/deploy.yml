# Push to main: the full suite, then an image per changed service to GHCR,
# then a Dokploy redeploy. Nothing publishes unless the full suite passed.
# A repository without Dokploy configured (DOKPLOY_URL unset) stops after
# the suite: the template repository itself never publishes.
name: Deploy

on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "**/*.md"]

# Merges in a row share a run: one runs, the newest waits, none is cancelled
# half way (a cancelled publish leaves services on different versions).
concurrency:
  group: full-${{ github.ref }}
  cancel-in-progress: false

jobs:
  suite:
    uses: ./.github/workflows/build.yml

  changes:
    if: vars.DOKPLOY_URL != ''
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.filter.outputs.changes }}
    steps:
      - uses: actions/checkout@v7
      # A change to a shared package publishes every service that imports it.
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            # This workflow too: a change to how images are built or named
            # must publish them again.
            api: ["services/api/**", "packages/**", "pnpm-lock.yaml", "Dockerfile", ".github/workflows/deploy.yml"]
            client: ["services/client/**", "packages/schemas/**", "pnpm-lock.yaml", "Dockerfile", ".github/workflows/deploy.yml"]

  publish:
    needs: [suite, changes]
    if: needs.changes.outputs.services != '[]' && needs.changes.outputs.services != ''
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: ${{ fromJSON(needs.changes.outputs.services) }}
    steps:
      - uses: actions/checkout@v7

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v4

      # Registry names are lower case; the owner may not be (Dr-Wade).
      - name: Image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}/${{ matrix.service }}" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v7
        with:
          context: .
          target: ${{ matrix.service }}
          push: true
          build-args: APP_VERSION=${{ github.sha }}
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      # Fails the job when the deployment itself fails, not only the trigger.
      # One Actions variable per service: DOKPLOY_API_APP_ID, DOKPLOY_CLIENT_APP_ID.
      - uses: Dr-Wade/dokploy-deploy-action@v1
        with:
          dokploy_url: ${{ vars.DOKPLOY_URL }}
          api_key: ${{ secrets.DOKPLOY_TOKEN }}
          application_id: ${{ vars[format('DOKPLOY_{0}_APP_ID', matrix.service == 'api' && 'API' || 'CLIENT')] }}
          wait_for_deployment: "true"
