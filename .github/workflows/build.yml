# The full suite: every test with coverage thresholds, E2E against the built
# app, the OpenAPI drift check. Called by deploy.yml, which publishes only
# after it passed, and by a PR labelled `full-ci`.
name: Full suite

on:
  workflow_call:
  pull_request:
    types: [labeled, synchronize]

env:
  DATABASE_URL: postgresql://brain:brain@localhost:4693/brain

jobs:
  full:
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.action == 'labeled' && github.event.label.name == 'full-ci') ||
      (github.event.action == 'synchronize' && contains(github.event.pull_request.labels.*.name, 'full-ci'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Start Postgres
        run: docker compose up -d --wait

      - run: pnpm build
      - run: pnpm db:deploy
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:coverage

      - name: OpenAPI and client SDK are up to date
        run: |
          pnpm openapi
          git diff --exit-code -- services/api/openapi.json services/client/src/api \
            || { echo "::error::Run 'pnpm openapi' and commit the result."; exit 1; }

      - name: E2E
        run: |
          pnpm exec playwright install --with-deps chromium
          pnpm e2e

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
